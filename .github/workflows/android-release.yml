name: Android Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name (e.g. 0.15.1); defaults to the tag on HEAD, then app/build.gradle.kts
        required: false
        type: string

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.metadata.outputs.version_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: metadata
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              version_tag = os.environ["GITHUB_REF_NAME"]
              if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", version_tag):
                  sys.exit("Release tags must use vMAJOR.MINOR.PATCH")
              version_name = version_tag[1:]
          else:
              version_name = os.environ.get("INPUT_VERSION_NAME", "").strip()
              if not version_name:
                  tags = subprocess.check_output(["git", "tag", "--points-at", "HEAD"], text=True).splitlines()
                  versions = [tag[1:] for tag in tags if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag)]
                  if versions:
                      version_name = max(versions, key=lambda v: tuple(map(int, v.split("."))))
                  else:
                      match = re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"', Path("app/build.gradle.kts").read_text())
                      if not match:
                          sys.exit("Cannot resolve versionName from app/build.gradle.kts")
                      version_name = match[1]
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version_name):
                  sys.exit("Version name must use MAJOR.MINOR.PATCH")
              version_tag = f"v{version_name}-manual.{run_number}"

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"VERSION_NAME={version_name}\nVERSION_CODE={run_number}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version_tag={version_tag}\n")
          PYTHON

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:lint :app:test
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName=${{ env.VERSION_NAME }} \
            -PversionCode=${{ env.VERSION_CODE }}

      - name: Save Play bundle and mapping
        uses: actions/upload-artifact@v4
        with:
          name: play-release-${{ steps.metadata.outputs.version_tag }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (changelog for tag) + upload APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(awk -v ver="${GITHUB_REF_NAME}" '
            BEGIN { found=0 }
            $0 ~ "^##[[:space:]]*" ver "$" { found=1; next }
            $0 ~ "^##[[:space:]]+v" { if (found) exit }
            found { print }
          ' CHANGELOG.md)
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/lexicardio_${{ env.VERSION_NAME }}_release.apk
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            app/build/outputs/apk/release/*.apk


  publish_play:
    name: Publish to Google Play internal testing
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Google Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          def fail(message):
              print(f"::error::{message}", flush=True)
              sys.exit(1)

          raw = os.environ.get("PLAY_SERVICE_ACCOUNT_JSON", "")
          if not raw:
              fail("Missing GitHub Actions Secret: PLAY_SERVICE_ACCOUNT_JSON")
          try:
              account = json.loads(raw)
          except json.JSONDecodeError:
              fail("PLAY_SERVICE_ACCOUNT_JSON must contain valid service account JSON")
          if not isinstance(account, dict):
              fail("PLAY_SERVICE_ACCOUNT_JSON must be a JSON object")
          if account.get("type") != "service_account" or not account.get("private_key"):
              fail("PLAY_SERVICE_ACCOUNT_JSON is not a service account key")
          if not isinstance(account.get("client_email"), str) or not account["client_email"].strip():
              fail("PLAY_SERVICE_ACCOUNT_JSON must include the service account client_email")
          print("Google Play service account configuration validated")
          PYTHON

      - name: Download signed bundle and mapping
        uses: actions/download-artifact@v4
        with:
          name: play-release-${{ needs.release.outputs.version_tag }}
          path: play-release

      - name: Publish App Bundle to internal testing
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.andongni.lexicardio
          releaseFiles: play-release/bundle/release/app-release.aab
          mappingFile: play-release/mapping/release/mapping.txt
          releaseName: ${{ needs.release.outputs.version_tag }}
          track: internal
          status: completed
